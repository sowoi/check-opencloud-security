description: |
  ### Impact

  `_resolve_webhook_address` resolved a webhook hostname with
  `socket.gethostbyname`, which returns only `A` records, while the actual
  delivery in `requests.post` resolves dual-stack. A hostname with a public `A`
  record and a private, loopback or link-local `AAAA` record therefore passed
  validation and could still be connected to over IPv6. The DNS-rebinding
  recheck performed immediately before delivery had the same blind spot.

  ### Patches

  Fixed in **1.14.2**. Resolution now uses `socket.getaddrinfo` and validates
  every address a hostname answers with, IPv4 and IPv6 alike, and unwraps
  IPv4-mapped, 6to4 and NAT64-encoded IPv6 literals.
