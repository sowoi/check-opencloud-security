<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img"
     aria-label="An OpenCloud instance being checked against a shield of security findings">
  <title>A scan in progress</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7089f4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#12b5a6" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7089f4"/>
      <stop offset="1" stop-color="#2b3fbb"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12b5a6" stop-opacity="0"/>
      <stop offset="1" stop-color="#12b5a6" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="260" rx="28" fill="url(#sky)"/>

  <!-- the instance -->
  <g>
    <rect x="42" y="74" width="150" height="104" rx="14" fill="#ffffff" opacity=".95"/>
    <rect x="42" y="74" width="150" height="26" rx="14" fill="#2b3fbb" opacity=".16"/>
    <circle cx="60" cy="87" r="4" fill="#e63946" opacity=".7"/>
    <circle cx="74" cy="87" r="4" fill="#f0a020" opacity=".7"/>
    <circle cx="88" cy="87" r="4" fill="#16b26a" opacity=".7"/>
    <rect x="60" y="116" width="94" height="9" rx="4.5" fill="#4360e8" opacity=".35"/>
    <rect x="60" y="134" width="114" height="9" rx="4.5" fill="#4360e8" opacity=".22"/>
    <rect x="60" y="152" width="70" height="9" rx="4.5" fill="#4360e8" opacity=".22"/>
  </g>

  <!-- the probe beam -->
  <g>
    <path d="M196 126h84" stroke="url(#beam)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="288" cy="126" r="7" fill="#12b5a6"/>
  </g>

  <!-- the verdict -->
  <g transform="translate(300 46)">
    <path fill="url(#shield)" d="M66 0 12 20v56c0 41 25 71 54 82 29-11 54-41 54-82V20L66 0z"/>
    <path fill="#ffffff" opacity=".94"
          d="M96 51a7 7 0 0 0-10 .6L60 80.4 47.6 68.1A7 7 0 1 0 37.7 78l17.6 17.4a7 7 0 0 0 10-.3l31.3-33.7A7 7 0 0 0 96 51z"/>
  </g>

  <!-- findings ticking away underneath -->
  <g opacity=".75">
    <rect x="42" y="196" width="86" height="12" rx="6" fill="#16b26a" opacity=".35"/>
    <rect x="138" y="196" width="60" height="12" rx="6" fill="#f0a020" opacity=".35"/>
    <rect x="208" y="196" width="42" height="12" rx="6" fill="#e63946" opacity=".3"/>
  </g>
</svg>
