<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-label="A reticle measuring a shield, drawn like a technical instrument">
  <title>The scan instrument</title>
  <!--
    Drawn by hand, and drawn twice: the tokens below give the same instrument
    a day shift and a night shift. Loaded with <img>, so these styles - and
    the small animations - are scoped to this document, and nothing else can
    be reached from here. The motion is a radar sweep, one expanding ring and
    a twinkle of static; reduced-motion readers get the still instrument.
  -->
  <style>
    svg {
      --line: #1a1c22; --faint: #717684;
      --brand: #3539c4; --accent: #c2410c; --core: #fbfaf4;
      --shield-top: #4a4ee0; --shield-bottom: #3539c4;
      --good: #0a7a4d; --fair: #b45309; --info: #1d6fa8; --bad: #c22424;
      --spark: #3539c4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --line: #e8e6dc; --faint: #7d8290;
        --brand: #a5b4fc; --accent: #5eead4; --core: #12151f;
        --shield-top: #c7d2fe; --shield-bottom: #a5b4fc;
        --good: #34d399; --fair: #fbbf24; --info: #38bdf8; --bad: #fb7185;
        --spark: #cdd8ff;
      }
    }
    .brand { stop-color: var(--brand); }
    .accent { stop-color: var(--accent); }
    .shield-top { stop-color: var(--shield-top); }
    .shield-bottom { stop-color: var(--shield-bottom); }
    .hair { stroke: var(--line); }
    .faint { stroke: var(--faint); }
    .core { fill: var(--core); }
    .good { fill: var(--good); }
    .fair { fill: var(--fair); }
    .info { fill: var(--info); }
    .bad { fill: var(--bad); }
    .spark { fill: var(--spark); }
    .sweep-stop { stop-color: var(--accent); }

    .sweep {
      animation: spin 8s linear infinite;
      transform-origin: 240px 150px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse-ring { animation: ring-out 3.4s ease-out infinite; }
    @keyframes ring-out {
      from { r: 64; opacity: .5; }
      to { r: 112; opacity: 0; }
    }

    .spark { animation: twinkle 4.6s ease-in-out infinite; }
    .spark-2 { animation-duration: 5.8s; animation-delay: 1.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: .2; }
      50% { opacity: .8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sweep, .pulse-ring, .spark { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="brand"/>
      <stop offset="1" class="accent"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="shield-top"/>
      <stop offset="1" class="shield-bottom"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="240" y1="150" x2="358" y2="91">
      <stop offset="0" class="sweep-stop" stop-opacity=".3"/>
      <stop offset="1" class="sweep-stop" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the crosshair the instrument is aligned on -->
  <g class="hair" stroke-opacity=".16" stroke-width="1">
    <path d="M60 150h360"/>
    <path d="M240 34v232"/>
  </g>

  <!-- the instrument: a minute ring, two circles and a sweep that never
       stops looking -->
  <circle cx="240" cy="150" r="118" fill="none" class="faint" stroke-opacity=".5"
          stroke-width="7" stroke-dasharray="1.5 4.678"/>
  <circle cx="240" cy="150" r="118" fill="none" class="hair" stroke-opacity=".55"
          stroke-width="11" stroke-dasharray="2 59.8"/>
  <circle cx="240" cy="150" r="88" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".4"/>
  <circle cx="240" cy="150" r="60" class="core" stroke="url(#ring)" stroke-width="1.5"/>
  <circle cx="240" cy="150" r="64" class="pulse-ring" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".5"/>
  <path class="sweep" fill="url(#sweep)" d="M240 150 L240 32 A118 118 0 0 1 342 91 Z"/>

  <!-- the shield at the centre -->
  <g transform="translate(182.4 96) scale(1.8)">
    <path fill="url(#shield)" d="M32 13l13 4.9v10.6c0 8.8-5.5 15.4-13 18.5-7.5-3.1-13-9.7-13-18.5V17.9L32 13z"/>
  </g>

  <!-- findings riding the minute ring -->
  <g stroke="var(--core)" stroke-width="2.5">
    <circle cx="342" cy="91" r="5" class="good"/>
    <circle cx="299" cy="252" r="5" class="info"/>
    <circle cx="138" cy="209" r="5" class="fair"/>
    <circle cx="181" cy="48" r="5" class="bad"/>
  </g>

  <!-- a little static in the air -->
  <path class="spark" transform="translate(150 96)" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6 -1.6 1.6 -6 0 -1.6-1.6Z"/>
  <path class="spark spark-2" transform="translate(352 210) scale(.75)" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6 -1.6 1.6 -6 0 -1.6-1.6Z"/>
</svg>
