<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="check-opencloud-security">
  <title>check-opencloud-security</title>
  <!--
    The mark carries its own two schemes. It is loaded with <img>, so it is a
    document of its own: the page's stylesheet cannot reach inside it, and the
    page's CSP does not apply to it either. Sunrise by day, moonlight by night.
  -->
  <style>
    svg { --shield-top: #f6a04a; --shield-bottom: #c94e1b; --tick: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --shield-top: #cdd8ff; --shield-bottom: #8b9ce0; --tick: #101838; }
    }
    .shield-top { stop-color: var(--shield-top); }
    .shield-bottom { stop-color: var(--shield-bottom); }
    .tick { fill: var(--tick); }
  </style>
  <defs>
    <linearGradient id="logoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="shield-top"/>
      <stop offset="1" class="shield-bottom"/>
    </linearGradient>
  </defs>
  <path fill="url(#logoFill)" d="M32 3 8 12v18c0 14.4 9.8 27.2 24 31 14.2-3.8 24-16.6 24-31V12L32 3z"/>
  <path class="tick" opacity=".94" d="M45.6 20.7a3 3 0 0 0-4.3.2L28.9 34.4l-6.1-6a3 3 0 0 0-4.2 4.3l8.3 8.2a3 3 0 0 0 4.3-.1l14.6-15.8a3 3 0 0 0-.2-4.3z"/>
  <path fill="#ffffff" opacity=".26" d="M32 3 8 12v18c0 3 .4 5.9 1.2 8.6C20.6 33 28.2 20.3 32 3z"/>
</svg>
