<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="check-opencloud-security">
  <title>check-opencloud-security</title>
  <!--
    The mark carries its own two schemes. It is loaded with <img>, so it is a
    document of its own: the page's stylesheet cannot reach inside it, and the
    page's CSP does not apply to it either. A squircle tile in the signal
    gradient, a shield cut from the surface, and a tick that answers it.
  -->
  <style>
    svg {
      --tile-a: #5b4bff; --tile-b: #b13ad4;
      --shield: #ffffff; --tick: #5b4bff; --sheen: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --tile-a: #a89dff; --tile-b: #e58ff0;
        --shield: #141722; --tick: #a89dff; --sheen: #ffffff;
      }
    }
    .tile-a { stop-color: var(--tile-a); }
    .tile-b { stop-color: var(--tile-b); }
    .shield { fill: var(--shield); }
    .tick { stroke: var(--tick); }
    .sheen { fill: var(--sheen); }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="tile-a"/>
      <stop offset="1" class="tile-b"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>
  <circle cx="18" cy="14" r="18" class="sheen" opacity=".12"/>
  <path class="shield" d="M32 13l13 4.9v10.6c0 8.8-5.5 15.4-13 18.5-7.5-3.1-13-9.7-13-18.5V17.9L32 13z"/>
  <path class="tick" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"
        d="M25.5 31.5l4.6 4.6 8.9-9.9"/>
</svg>
