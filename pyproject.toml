[project]
name = "check-opencloud-security"
version = "1.32.0"
description = "Check the security level of your OpenCloud instance with a built-in scanner - no API access required"
authors = [{ name = "Massoud Ahmed" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "certifi>=2026.7.22",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260906",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# Shell completion. Optional on purpose: a monitoring host running this from
# cron has no use for it, and the plugin works without it.
completion = ["argcomplete>=3.7.2"]
# The public web application (see docs/webapp.md). Deliberately an extra and
# never a dependency: the plugin on a monitoring host must stay small, and the
# wheel on PyPI ships neither `webapp/` nor `frontend/`. The web app is
# distributed as the GitHub release tarball built by
# `scripts/build_web_bundle.py`.
web = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    # Upper bound comes from arq, which pins redis[hiredis]<6.
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "cryptography>=50.0.0",
]
# Signature verification for `check-opencloud-scanner refresh-data`. An extra
# rather than a dependency for the same reason `completion` is: it pulls in a
# dozen transitive packages, and a refresh without it still runs - it just
# falls back to the structural guards and says so. See ADR 0027.
signing = ["sigstore>=4.5.0"]
# The agent-facing layer: an MCP server mounted on the web application, plus
# the in-process HTTP client it drives the REST API with. Separate from `web`
# because a deployment that only serves the website and the JSON API has no
# use for it, and `COS_WEB_ENABLE_MCP` is off without it.
mcp = [
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
check-opencloud-security = "check_opencloud_security:main"
check-opencloud-scanner = "opencloud_local_scan.cli:main"

# PyPI renders these as the sidebar links on the project page. "Live demo" is
# the hosted web application: the same scanner this package installs, running
# in a browser, so somebody reading the page can see what it does before
# installing anything.
[project.urls]
Homepage = "https://github.com/sowoi/check-opencloud-security"
"Live demo" = "https://scan.okxo.de"
Documentation = "https://github.com/sowoi/check-opencloud-security#readme"
Source = "https://github.com/sowoi/check-opencloud-security"
Changelog = "https://github.com/sowoi/check-opencloud-security/blob/main/CHANGELOG.md"
Issues = "https://github.com/sowoi/check-opencloud-security/issues"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = [
    "check_opencloud_security.py",
    "opencloud_local_scan",
]
# Belt and braces: `only-include` already limits the wheel, and this makes the
# intent explicit so a later addition to that list cannot drag the web app
# onto PyPI. tests/test_packaging.py enforces it.
exclude = [
    "frontend",
    "webapp",
]

[tool.hatch.build.targets.sdist]
include = [
    "check_opencloud_security.py",
    "opencloud_local_scan/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = [
    "frontend",
    "webapp",
    "tests/test_webapp_*.py",
    "tests/webapp_support.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "argcomplete>=3.7.2",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    # The web application tests drive the ASGI app through httpx2, which is
    # what `starlette.testclient` wants since Starlette 1.6 - plain httpx still
    # works there but warns. They skip themselves when these are missing, so
    # the plugin suite still runs alone.
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx2>=2.12.0",
    # tests/browser_support.py serves the app with it directly; without this
    # line it only arrived as a dependency of `mcp`.
    "uvicorn>=0.52.4",
    "build>=1.6.0",
    "hatchling>=1.32.0",
    "cryptography>=50.0.1",
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "mcp>=2.2.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "openapi-spec-validator>=0.9.0",
    "pytest-cov>=7.1.0",
    # Browser tests of the web application (tests/test_webapp_browser_*.py):
    # real rendering, JavaScript and the Content-Security-Policy, which the
    # ASGI test client never executes. Test-only, and the tests skip when the
    # package or its Firefox build is missing. Reviewed in
    # security/dependencies/playwright.yml; ADR 0061. Held below 1.64: its
    # WebKit reports a CSP violation for the user-agent stylesheet of every
    # <select>, which fails every browser test on a page with one.
    "playwright>=1.63.0,<1.64",
    # Property-based tests of the parsers that take text from outside:
    # version strings, security headers, the SSRF guard and the ';'-joined
    # configuration lists (tests/test_properties.py). Test-only; reviewed in
    # security/dependencies/hypothesis.yml.
    "hypothesis>=6.168.0",
]
# Manual mutation testing of the plugin's judging code (the /mutation-test
# skill, the mutation-tester agent). Its own group so neither CI nor a plain
# `uv sync` installs it; run with `uv run --group mutation`. Reviewed in
# security/dependencies/mutmut.yml.
mutation = [
    "mutmut>=3.8.0",
]

[tool.mutmut]
# Manual mutation testing only (/mutation-test, ADR 0060 record mutmut.yml).
# mutmut mutates a copy in mutants/ (git-ignored) and runs the fast,
# in-process tests listed here against it; the subprocess and browser tests
# cannot see a mutant and would only make the run slow.
source_paths = ["check_opencloud_security.py", "opencloud_local_scan/"]
pytest_add_cli_args_test_selection = [
    "tests/test_rating_thresholds.py",
    "tests/test_baseline.py",
    "tests/test_waivers.py",
    "tests/test_waiver_expiry.py",
    "tests/test_perfdata.py",
    "tests/test_webhook.py",
    "tests/test_explain.py",
    "tests/test_check_vulnerabilities.py",
    "tests/test_eol_warning.py",
    "tests/test_waiver_warning.py",
    "tests/test_coverage_perfdata.py",
    "tests/test_upgrade_path.py",
    "tests/test_upgrade_rehearsal.py",
    "tests/test_verify_remediation.py",
    "tests/test_threshold_profiles.py",
    "tests/test_policy_gate.py",
    "tests/test_coverage_regression.py",
]
also_copy = ["tests", "webapp", "frontend", "docker", "authentik", "docs", "security", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = "."
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "mutants",
]
markers = [
    "integration: tests that require an external container runtime",
]

# Coverage is a floor, not a target. This plugin's whole value is that its
# verdicts are trustworthy, and an untested branch in `scanner.py` or `tls.py`
# is a verdict nobody checked. `fail_under` below sits just under what the
# suite already reaches, so it fails on a regression rather than on an
# ordinary refactor.
[tool.coverage.run]
branch = true
# Both entry points are tested as a monitoring system runs them - as a
# subprocess - so measuring only this process reported the plugin at 78% while
# the suite really reached 92%, and counted the whole SARIF/JUnit/Prometheus
# surface as untested. Each process now writes its own data file and pytest-cov
# combines them; `tests/conftest.coverage_environment` is what carries the
# measurement across the deliberately scrubbed subprocess environment.
parallel = true
# The Prometheus exporter is a server a test stops with a signal. Without this
# its data file is never written and the exporter looks untested again.
sigterm = true
# Module names, not file paths. A subprocess started by `run_plugin` inherits
# the per-test working directory `conftest.clean_config_files` moved into, so a
# relative `check_opencloud_security.py` resolves against a temporary directory
# and matches nothing; the importable name resolves the same way in every
# process, which is the only form that survives the move.
source = [
    "check_opencloud_security",
    "opencloud_local_scan",
    "webapp",
]
omit = [
    # Interactive, and driven by its own tests through a scripted stdin rather
    # than by import: measuring it here reports the prompts as uncovered.
    # Wildcard-anchored for the same reason the sources are module names - the
    # recorded path is absolute, and a bare relative pattern stopped matching
    # once the subprocess runs were combined in.
    "*/opencloud_local_scan/wizard.py",
]

[tool.coverage.report]
# The suite sits at 89%. The floor is two points below that so an ordinary
# refactor does not fail the build, while a module arriving untested does.
# Raise it when the real number climbs; never lower it to make a branch pass.
fail_under = 87
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    # Guarded fall-backs for interpreters and optional tools this suite does
    # not have all of at once; the comment is the existing convention here.
    "pragma: no cover",
]
