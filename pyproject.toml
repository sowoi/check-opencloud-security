[project]
name = "check-opencloud-security"
version = "1.11.3"
description = "Check the security level of your OpenCloud instance with a built-in scanner - no API access required"
authors = [{ name = "Massoud Ahmed" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "certifi>=2026.7.22",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# Shell completion. Optional on purpose: a monitoring host running this from
# cron has no use for it, and the plugin works without it.
completion = ["argcomplete>=3.6.2"]
# The public web application (see docs/webapp.md). Deliberately an extra and
# never a dependency: the plugin on a monitoring host must stay small, and the
# wheel on PyPI ships neither `webapp/` nor `frontend/`. The web app is
# distributed as the GitHub release tarball built by
# `scripts/build_web_bundle.py`.
web = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    # Upper bound comes from arq, which pins redis[hiredis]<6.
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "cryptography>=50.0.0",
]
# The agent-facing layer: an MCP server mounted on the web application, plus
# the in-process HTTP client it drives the REST API with. Separate from `web`
# because a deployment that only serves the website and the JSON API has no
# use for it, and `COS_WEB_ENABLE_MCP` is off without it.
mcp = [
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
check-opencloud-security = "check_opencloud_security:main"
check-opencloud-scanner = "opencloud_local_scan.cli:main"

# PyPI renders these as the sidebar links on the project page. "Live demo" is
# the hosted web application: the same scanner this package installs, running
# in a browser, so somebody reading the page can see what it does before
# installing anything.
[project.urls]
Homepage = "https://github.com/sowoi/check-opencloud-security"
"Live demo" = "https://scan.okxo.de"
Documentation = "https://github.com/sowoi/check-opencloud-security#readme"
Source = "https://github.com/sowoi/check-opencloud-security"
Changelog = "https://github.com/sowoi/check-opencloud-security/blob/main/CHANGELOG.md"
Issues = "https://github.com/sowoi/check-opencloud-security/issues"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = [
    "check_opencloud_security.py",
    "opencloud_local_scan",
]
# Belt and braces: `only-include` already limits the wheel, and this makes the
# intent explicit so a later addition to that list cannot drag the web app
# onto PyPI. tests/test_packaging.py enforces it.
exclude = [
    "frontend",
    "webapp",
]

[tool.hatch.build.targets.sdist]
include = [
    "check_opencloud_security.py",
    "opencloud_local_scan/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = [
    "frontend",
    "webapp",
    "tests/test_webapp_*.py",
    "tests/webapp_support.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "argcomplete>=3.7.2",
    "mypy>=2.3.0",
    "nox>=2026.8.10",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    # The web application tests drive the ASGI app through httpx2, which is
    # what `starlette.testclient` wants since Starlette 1.6 - plain httpx still
    # works there but warns. They skip themselves when these are missing, so
    # the plugin suite still runs alone.
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx2>=2.10.0",
    "build>=1.5.0",
    "hatchling>=1.32.0",
    "cryptography>=50.0.0",
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "mcp>=2.0.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
]

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "integration: tests that require an external container runtime",
]
