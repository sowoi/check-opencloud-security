[project]
name = "check-opencloud-security"
version = "1.0.1"
description = "Check the security level of your OpenCloud instance with a built-in scanner - no API access required"
authors = [{ name = "Massoud Ahmed" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "certifi>=2026.7.22",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "PyYAML>=6.0.3",
]

[project.scripts]
check-opencloud-security = "check_opencloud_security:main"
check-opencloud-scanner = "opencloud_local_scan.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = [
    "check_opencloud_security.py",
    "opencloud_local_scan",
]

[tool.hatch.build.targets.sdist]
include = [
    "check_opencloud_security.py",
    "opencloud_local_scan/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "mypy>=2.3.0",
    "nox>=2026.8.10",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = "."
