# The published web application in one command: frontend, worker and Redis.
#
#   cd docker
#   docker compose -f docker-compose.dockerhub.yml up -d
#   open http://127.0.0.1:8811
#
# This stack pulls `okxo/opencloud-scanner:latest` for both application
# services. The existing docker-compose.yml remains the local-build stack.

services:
  web_app:
    image: okxo/opencloud-scanner:latest
    pull_policy: always
    container_name: opencloud-scan-hub-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8811:8811"
    environment:
      COS_WEB_REDIS_URL: "redis://:${COS_REDIS_PASSWORD:-}@redis:6379/0"
      # How long a result stays readable. Also the lifetime of every key.
      COS_WEB_RESULT_TTL: "3600"
      # Rate limits: per client address, and per target instance.
      COS_WEB_IP_RATE_LIMIT: "10"
      COS_WEB_IP_RATE_WINDOW: "60"
      COS_WEB_TARGET_COOLDOWN: "300"
      # Set this only when a reverse proxy overwrites X-Forwarded-For.
      COS_WEB_TRUST_FORWARDED_FOR: "false"
      # Required. The address this service is reached at from outside, so the
      # canonical links and sitemap.xml do not publish URLs nobody can reach.
      COS_WEB_PUBLIC_BASE_URL: "${COS_WEB_PUBLIC_BASE_URL:-http://localhost:8811}"
      # Do not query the release feed once per visitor by default.
      COS_WEB_RELEASES_MODE: "off"
      # Re-read the OpenCloud release lifecycle page once a day, so a
      # deployment that has been up for months does not rate instances
      # against the schedule its image was built with. One request a day
      # for the whole stack; set 'false' with no outbound access.
      COS_WEB_SCHEDULE_REFRESH: "true"
      # Ask the advisory feed once a day which vulnerabilities affect
      # OpenCloud, so an advisory published after this image was built still
      # reaches the people scanning with it. A refresh only ever adds an
      # advisory and never believes one with no version bounds; set 'false'
      # with no outbound access.
      COS_WEB_ADVISORY_REFRESH: "true"
      # The browsable /docs and /redoc pages. /openapi.json, /arazzo.json and
      # /.well-known/ai.json are public whatever this says.
      COS_WEB_ENABLE_DOCS: "true"
      # The MCP endpoint at /mcp, for AI agents. Turn it off without editing
      # this file: COS_WEB_ENABLE_MCP=false docker compose up -d. Leave the
      # host list empty behind a proxy that already fixes the Host header.
      COS_WEB_ENABLE_MCP: "${COS_WEB_ENABLE_MCP:-true}"
      COS_WEB_MCP_ALLOWED_HOSTS: ""
      # An optional sign-in in front of /mcp, off by default. Set an issuer
      # and this becomes an OAuth 2.0 resource server: a token verified
      # against the provider's published keys, and nothing else changed -
      # authentication decides who may ask, never how hard.
      # docker-compose.authentik.yml is this stack with a provider already in
      # it, one command and no variables to set, and docs/authentik.md walks
      # through it. The issuer, the audience and a public base URL are all
      # required once it is on, and a missing one refuses to start rather
      # than serve /mcp open.
      COS_WEB_MCP_AUTH_ENABLED: "${COS_WEB_MCP_AUTH_ENABLED:-false}"
      COS_WEB_MCP_AUTH_ISSUER: "${COS_WEB_MCP_AUTH_ISSUER:-}"
      COS_WEB_MCP_AUTH_AUDIENCE: "${COS_WEB_MCP_AUTH_AUDIENCE:-}"
      COS_WEB_MCP_AUTH_JWKS_URL: "${COS_WEB_MCP_AUTH_JWKS_URL:-}"
      COS_WEB_MCP_AUTH_RESOURCE_URL: "${COS_WEB_MCP_AUTH_RESOURCE_URL:-}"
      COS_WEB_MCP_AUTH_SCOPES: "${COS_WEB_MCP_AUTH_SCOPES:-}"
    networks:
      - default
      - scanner_internal
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  arq_worker:
    image: okxo/opencloud-scanner:latest
    pull_policy: always
    container_name: opencloud-scan-hub-worker
    restart: unless-stopped
    command: ["python", "-m", "webapp.tasks"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      COS_WEB_REDIS_URL: "redis://:${COS_REDIS_PASSWORD:-}@redis:6379/0"
      COS_WEB_RESULT_TTL: "3600"
      # These values are the service's complete scanning load on other hosts.
      COS_WEB_MAX_WORKERS: "5"
      COS_WEB_SCAN_CONCURRENCY: "4"
      COS_WEB_SCAN_TIMEOUT: "15"
      COS_WEB_JOB_TIMEOUT: "180"
      COS_WEB_ALLOW_PRIVATE_TARGETS: "false"
      COS_WEB_CHECK_DEBUG_PORTS: "false"
      COS_WEB_RELEASES_MODE: "off"
      # Re-read the OpenCloud release lifecycle page once a day, so a
      # deployment that has been up for months does not rate instances
      # against the schedule its image was built with. One request a day
      # for the whole stack; set 'false' with no outbound access.
      COS_WEB_SCHEDULE_REFRESH: "true"
      # Ask the advisory feed once a day which vulnerabilities affect
      # OpenCloud, so an advisory published after this image was built still
      # reaches the people scanning with it. A refresh only ever adds an
      # advisory and never believes one with no version bounds; set 'false'
      # with no outbound access.
      COS_WEB_ADVISORY_REFRESH: "true"
    # The image health check probes the web server. The worker has no HTTP
    # listener, so verify its PID and the Redis connection it needs instead.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from redis import Redis; os.kill(1, 0); Redis.from_url(os.environ['COS_WEB_REDIS_URL']).ping()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - default
      - scanner_internal
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:8.10-alpine
    container_name: opencloud-scan-hub-redis
    restart: unless-stopped
    # Results are ephemeral and must not be written to a disk.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      # Set COS_REDIS_PASSWORD in docker/.env and Redis requires it; leave it
      # unset and this behaves exactly as it did before. Redis answers whoever
      # reaches it, and what it holds is every live scan and every result still
      # inside its TTL, so set one on anything that is not a laptop.
      --requirepass "${COS_REDIS_PASSWORD:-}"
    environment:
      # redis-cli reads this, so the health check authenticates without the
      # password appearing in its own command line.
      REDISCLI_AUTH: "${COS_REDIS_PASSWORD:-}"
    # No published port, and `internal` on the network below means it has no
    # route off the host either.
    networks:
      - scanner_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

networks:
  # The application containers keep the default network: a scan is an outbound
  # request and the web service is published on a port. Redis is only on the
  # internal one, which has no gateway at all.
  scanner_internal:
    internal: true
