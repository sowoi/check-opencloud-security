# The whole web application in one command: frontend, backend and Redis.
#
#   cd docker
#   docker compose up --build -d
#   open http://127.0.0.1:8811
#
# `web_app` serves the pages and the API out of `frontend/`; `arq_worker` runs
# the scanner itself. Both are built from `Dockerfile.web` and run the same
# image - they differ only in the command, which is what keeps the code the
# page describes and the code the scan runs from drifting apart.
#
# `docker-compose.authentik.yml` next to this file is a different deployment of
# the same thing: this stack *plus* Authentik, with the MCP endpoint requiring
# a sign-in. Use one or the other, not both. This one is the public shape -
# open to anybody, which is the point of it.
#
# `docker-compose.monitoring.yml` next to this file is the plugin's own stack -
# the optional scan service for monitoring hosts - and is unrelated:
#
#   docker compose -f docker-compose.monitoring.yml up -d scanner
#
# Paths are relative to this directory; the build context is the repository
# root one level up, because the image needs `webapp/` and `frontend/`.
#
# Two rules this file exists to enforce:
#
# - concurrency is set here and nowhere else. Nothing a visitor sends can
#   change COS_WEB_MAX_WORKERS or COS_WEB_SCAN_CONCURRENCY, and when both
#   workers are busy the eleventh visitor queues rather than being refused;
# - Redis is a cache, not a database. It writes nothing to disk, it is capped,
#   and it evicts rather than growing - every key has a TTL anyway.

services:
  web_app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: check-opencloud-security-web:latest
    container_name: opencloud-scan-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8811:8811"
    environment:
      COS_WEB_REDIS_URL: "redis://:${COS_REDIS_PASSWORD:-}@redis:6379/0"
      # How long a result stays readable. Also the lifetime of every key.
      COS_WEB_RESULT_TTL: "3600"
      # Rate limits: per client address, and per target instance.
      COS_WEB_IP_RATE_LIMIT: "10"
      COS_WEB_IP_RATE_WINDOW: "60"
      COS_WEB_TARGET_COOLDOWN: "300"
      # Targets one POST /api/scans/batch may carry. A batch is a convenience,
      # not a discount: every target still counts against the client limit and
      # still claims its own cooldown.
      COS_WEB_MAX_BATCH_TARGETS: "10"
      # Only set this when a reverse proxy in front *overwrites*
      # X-Forwarded-For. Trusting a header a client can send makes the client
      # rate limit decorative.
      COS_WEB_TRUST_FORWARDED_FOR: "false"
      # Required. The address this service is reached at from outside: behind
      # a proxy it only ever sees its own, and the canonical links and
      # sitemap.xml would then publish URLs nobody can reach. Set it to the
      # public address before putting this anywhere but a laptop.
      COS_WEB_PUBLIC_BASE_URL: "${COS_WEB_PUBLIC_BASE_URL:-http://localhost:8811}"
      # Optional landing-page metadata as name=content. The application
      # renders a name/content tag and never treats this as raw HTML.
      COS_WEB_INDEX_META_TAG: "${COS_WEB_INDEX_META_TAG:-}"
      # Let search engines index the five public pages. A result page carries
      # noindex whatever this says: the uuid is the whole of the
      # authorisation. Set it to "false" for a deployment nobody should find.
      COS_WEB_ALLOW_INDEXING: "true"
      # The update check reads OpenCloud's release feed. Off by default so a
      # public deployment does not query it once per visitor; set 'auto' and a
      # token to turn it on.
      COS_WEB_RELEASES_MODE: "off"
      # Re-read the OpenCloud release lifecycle page once a day, so a
      # deployment that has been up for months does not rate instances
      # against the schedule its image was built with. One request a day
      # for the whole stack; set 'false' with no outbound access.
      COS_WEB_SCHEDULE_REFRESH: "true"
      # Ask the advisory feed once a day which vulnerabilities affect
      # OpenCloud, so an advisory published after this image was built still
      # reaches the people scanning with it. A refresh only ever adds an
      # advisory and never believes one with no version bounds; set 'false'
      # with no outbound access.
      COS_WEB_ADVISORY_REFRESH: "true"
      # The browsable Swagger UI and ReDoc pages at /docs and /redoc. Off in
      # public: enabling them relaxes the content policy on those two paths.
      # /openapi.json, /arazzo.json and /.well-known/ai.json are public
      # whatever this says - a description nobody can fetch describes nothing.
      COS_WEB_ENABLE_DOCS: "true"
      # The MCP endpoint at /mcp, which lets an AI agent run the same
      # workflows through the same rate limits. Needs the 'mcp' extra, which
      # the web image installs.
      #
      # To run without it, set it in the environment or in a .env file next to
      # this one rather than editing here:
      #
      #     COS_WEB_ENABLE_MCP=false docker compose up -d
      #
      # The host list is the DNS-rebinding check - name the public hostname
      # when this is reachable from a browser, or leave it empty behind a
      # proxy that already fixes the Host header.
      COS_WEB_ENABLE_MCP: "${COS_WEB_ENABLE_MCP:-true}"
      COS_WEB_MCP_ALLOWED_HOSTS: ""
      COS_WEB_MCP_MAX_CONCURRENT_WAITS: "8"
      # Sign-in in front of /mcp. Off, because the public deployment is meant
      # to answer anybody; an estate running this for itself either sets the
      # four variables below against an identity provider it already has, or
      # brings up `docker-compose.authentik.yml` next to this file, which is
      # this stack and an identity provider together and needs none of them:
      #
      #     ./authentik-env.sh
      #     docker compose -f docker-compose.authentik.yml up -d
      #
      # This service only ever *verifies* a token: it checks the signature
      # against the provider's published keys, the issuer, the audience and
      # the expiry, and holds no account, session or client secret of its own.
      # Authentication decides who may ask, never how hard - the rate limits,
      # the cooldown and the SSRF guard are identical for an agent that signed
      # in.
      #
      # The issuer is the value from the provider's discovery document. For
      # Authentik that is the per-provider form, ending in a slash:
      # https://sso.example.com/application/o/<application-slug>/
      # The audience is the provider's client ID, which is what Authentik puts
      # in a token's `aud` claim.
      #
      # Setting COS_WEB_MCP_AUTH_ENABLED without an issuer, without an
      # audience or without a public base URL is refused at startup rather
      # than served open. The audience matters most of the three: a provider
      # that serves other applications signs their tokens with the same key,
      # so an `aud` nobody compares makes every one of them a key to /mcp.
      COS_WEB_MCP_AUTH_ENABLED: "${COS_WEB_MCP_AUTH_ENABLED:-false}"
      COS_WEB_MCP_AUTH_ISSUER: "${COS_WEB_MCP_AUTH_ISSUER:-}"
      COS_WEB_MCP_AUTH_AUDIENCE: "${COS_WEB_MCP_AUTH_AUDIENCE:-}"
      # Only when the provider publishes its keys somewhere other than
      # <issuer>/jwks/, and only when the resource URL is not
      # <public base URL>/mcp.
      COS_WEB_MCP_AUTH_JWKS_URL: "${COS_WEB_MCP_AUTH_JWKS_URL:-}"
      COS_WEB_MCP_AUTH_RESOURCE_URL: "${COS_WEB_MCP_AUTH_RESOURCE_URL:-}"
      # Scopes a token must carry, separated by ';'. Empty means any valid
      # token from the named issuer is enough.
      COS_WEB_MCP_AUTH_SCOPES: "${COS_WEB_MCP_AUTH_SCOPES:-}"
      # An audit record for every scan request, rejection and triggered limit,
      # on the check_opencloud.web.audit logger as one JSON object per line.
      # Off by default: the ordinary log carries lifecycle markers and uuids
      # only. Addresses are always fingerprints; the target becomes one too
      # unless COS_WEB_AUDIT_LOG_TARGETS says otherwise, and an unset
      # COS_WEB_AUDIT_SALT means nothing correlates across a restart.
      COS_WEB_AUDIT_LOG: "false"
      COS_WEB_AUDIT_LOG_TARGETS: "false"
      # Erasure on request: DELETE /api/purge answers 404 until a secret is
      # set here, because the call deletes results belonging to whoever is
      # currently reading them. The signing key makes the proof of deletion
      # verifiable long after the data itself is gone.
      COS_WEB_PURGE_TOKEN: ""
      COS_WEB_PURGE_SIGNING_KEY: ""
      # Signs the exact bytes of JSON, SARIF, CSV and PDF downloads. Keep this
      # in a secret store; verifiers need the same value.
      COS_WEB_EXPORT_SIGNING_KEY: "${COS_WEB_EXPORT_SIGNING_KEY:-}"
      # Encrypt the stored result document with AES-256-GCM. Both this service
      # and the worker must agree, and both need the same key: the worker
      # writes the document and the web process reads it back. A key is 64 hex
      # characters (32 bytes); the highest version encrypts, lower ones still
      # decrypt, which is how one is rotated. A process asked to encrypt
      # without a usable key refuses to start rather than store plaintext.
      COS_WEB_ENCRYPT_RESULTS: "false"
      # COS_WEB_ENCRYPTION_KEY_1: "<64 hex characters>"
    networks:
      - default
      - scanner_internal
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  arq_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: check-opencloud-security-web:latest
    container_name: opencloud-scan-worker
    restart: unless-stopped
    command: ["python", "-m", "webapp.tasks"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      COS_WEB_REDIS_URL: "redis://:${COS_REDIS_PASSWORD:-}@redis:6379/0"
      COS_WEB_RESULT_TTL: "3600"
      # Scans running at once, and probes in flight within one scan. These two
      # numbers are the whole of this service's load on the outside world, and
      # they are only ever set here.
      COS_WEB_MAX_WORKERS: "5"
      COS_WEB_SCAN_CONCURRENCY: "4"
      COS_WEB_SCAN_TIMEOUT: "15"
      COS_WEB_JOB_TIMEOUT: "180"
      # Refuse private, loopback and link-local targets. Turn this on only for
      # a deployment that is meant to scan its own network.
      COS_WEB_ALLOW_PRIVATE_TARGETS: "false"
      # Connecting to extra ports on a host a stranger submitted is a port
      # scan. Off unless the targets are your own.
      COS_WEB_CHECK_DEBUG_PORTS: "false"
      # Whether this container can dial an IPv6 address at all. Docker's
      # default network is IPv4 only unless the host and this stack were
      # both set up for IPv6, which most installs are not. False - the
      # default - skips the IPv4/IPv6 TLS-parity check and notes why in the
      # result instead of reporting an instance's IPv6 side as unreachable
      # for a limitation of this deployment rather than of the instance.
      COS_WEB_IPV6_ENABLED: "false"
      COS_WEB_RELEASES_MODE: "off"
      # Re-read the OpenCloud release lifecycle page once a day, so a
      # deployment that has been up for months does not rate instances
      # against the schedule its image was built with. One request a day
      # for the whole stack; set 'false' with no outbound access.
      COS_WEB_SCHEDULE_REFRESH: "true"
      # Ask the advisory feed once a day which vulnerabilities affect
      # OpenCloud, so an advisory published after this image was built still
      # reaches the people scanning with it. A refresh only ever adds an
      # advisory and never believes one with no version bounds; set 'false'
      # with no outbound access.
      COS_WEB_ADVISORY_REFRESH: "true"
      # Encrypt the stored result document with AES-256-GCM. Both this service
      # and the worker must agree, and both need the same key: the worker
      # writes the document and the web process reads it back. A key is 64 hex
      # characters (32 bytes); the highest version encrypts, lower ones still
      # decrypt, which is how one is rotated. A process asked to encrypt
      # without a usable key refuses to start rather than store plaintext.
      COS_WEB_ENCRYPT_RESULTS: "false"
      # COS_WEB_ENCRYPTION_KEY_1: "<64 hex characters>"
    # The image health check probes the web server. The worker has no HTTP
    # listener, so verify its PID and the Redis connection it needs instead.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from redis import Redis; os.kill(1, 0); Redis.from_url(os.environ['COS_WEB_REDIS_URL']).ping()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - default
      - scanner_internal
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:8.10-alpine
    container_name: opencloud-scan-redis
    restart: unless-stopped
    # No persistence: nothing here is worth surviving a restart, and a dump
    # file would be a copy of everybody's scans sitting on a disk.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      # Set COS_REDIS_PASSWORD in docker/.env and Redis requires it; leave it
      # unset and this behaves exactly as it did before. Redis answers whoever
      # reaches it, and what it holds is every live scan and every result still
      # inside its TTL, so set one on anything that is not a laptop.
      --requirepass "${COS_REDIS_PASSWORD:-}"
    environment:
      # redis-cli reads this, so the health check authenticates without the
      # password appearing in its own command line.
      REDISCLI_AUTH: "${COS_REDIS_PASSWORD:-}"
    # No published port, and `internal` on the network below means it has no
    # route off the host either.
    networks:
      - scanner_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

networks:
  # The application containers keep the default network: a scan is an outbound
  # request and the web service is published on a port. Redis is only on the
  # internal one, which has no gateway at all.
  scanner_internal:
    internal: true
