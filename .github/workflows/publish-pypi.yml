name: Publish to PyPI

on:
  push:
    branches:
      - main
  # Completes a release that stopped after its tag was pushed - see the
  # "Check what this version still needs" step and adr/0067.
  workflow_dispatch:

# A manual run and a push must never release the same version side by side.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # id-token and attestations are what let a downloader verify with
  # `gh attestation verify` that an artifact really came out of this workflow.
  id-token: write
  attestations: write

jobs:
  publish:
    name: Read version and publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # This job pushes with git, so the checkout keeps its credentials.
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Read version
        id: version
        # Also exported as $VERSION, so shell steps read it from the environment
        # rather than having an expression pasted into the script text.
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # A tag alone does not mean the release is done: the tag is pushed
      # before the GitHub release is created, and v1.25.0 stopped between the
      # two on an HTTP 500 from the asset upload. Every later run then saw the
      # tag and skipped. So the published release is what ends a version:
      #   release   - no tag yet: write the notes, build, publish, tag, release
      #   resume    - tagged, but no published release: rebuild from the tag
      #               and finish the release, without touching the notes
      #   done      - tagged and released: nothing to do
      - name: Check what this version still needs
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            mode="release"
          elif [ "$draft" = "false" ]; then
            mode="done"
            echo "Release ${tag} is already published. Nothing to do."
          else
            mode="resume"
            echo "::warning::Tag ${tag} exists without a published release; completing it from the tag."
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"

      # Main may have moved on since the tag; the release ships what was tagged.
      # The wheel and the sdist build reproducibly, so the rebuilt files match
      # the ones PyPI already holds and the upload below skips them.
      - name: Check out the tagged release
        if: steps.state.outputs.mode == 'resume'
        run: git checkout --detach "v${VERSION}"

      # OpenCloud publishes no maintenance schedule, so the supported majors
      # are derived from the GitHub release history before the wheel is built.
      # That way the published package rates unmaintained majors as end of
      # life and knows the newest release for its offline update check.
      # An unreachable documentation site must not block a release, hence
      # --allow-failure: the previously committed file stays in place.
      # The same run rewrites the generated release table in README.md, so the
      # documentation cannot quote a version that has already been superseded.
      - name: Refresh the OpenCloud release schedule
        if: steps.state.outputs.mode == 'release'
        run: python scripts/update_release_schedule.py --allow-failure

      # The version in pyproject.toml changed - it is only ever bumped by hand.
      # The changes collected under '## [Unreleased]' in CHANGELOG.md become
      # the notes of that version, and the same entry is written to RELEASE.md.
      - name: Update CHANGELOG.md and RELEASE.md
        if: steps.state.outputs.mode == 'release'
        run: python scripts/release_notes.py --version "$VERSION"

      # The operator area's Releases tab is generated from the released
      # sections of CHANGELOG.md, which the step above just gained one of.
      # Regenerated here, in the same commit, or every check on main would
      # find the page stale from the moment a release is published.
      - name: Regenerate the operator area's release notes
        if: steps.state.outputs.mode == 'release'
        run: uv run --locked --group test python scripts/build_frontend_documentation.py

      # After the release notes and the page above, because both indexes
      # embed the version and the admin one embeds the Releases page text.
      - name: Build the static frontend search index
        if: steps.state.outputs.mode == 'release'
        run: python scripts/build_search_index.py

      - name: Commit release notes
        if: steps.state.outputs.mode == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md RELEASE.md README.md \
            opencloud_local_scan/data/release_schedule.json \
            frontend/static/search-index.json \
            frontend/static/search-index.de.json \
            frontend/static/search-index.es.json \
            frontend/static/search-index.fr.json \
            frontend/templates/admin-docs/releases.html \
            webapp/data/admin-search-index.json \
            webapp/data/admin-search-index.de.json \
            webapp/data/admin-search-index.es.json \
            webapp/data/admin-search-index.fr.json
          if git diff --cached --quiet; then
            echo "Release notes are already up to date."
          else
            git commit -m "docs: release notes for v${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build package
        if: steps.state.outputs.mode != 'done'
        run: uv build

      # The SBOM is generated from a resolved runtime environment rather than
      # from the metadata alone, so it lists the versions that were actually
      # installed, transitive ones included. It is kept out of dist/ because
      # `uv publish` uploads everything it finds there.
      - name: Generate SBOM
        if: steps.state.outputs.mode != 'done'
        run: |
          mkdir -p sbom
          uv sync --locked --no-dev
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --of JSON --pyproject pyproject.toml --mc-type application \
            -o "sbom/check-opencloud-security-${VERSION}.cdx.json"

      # Provenance ties each artifact to this workflow, this commit and this
      # runner. Signed with a short-lived Sigstore certificate, so there is no
      # signing key for this project to leak.
      - name: Attest build provenance
        if: steps.state.outputs.mode != 'done'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"

      # actions/attest-sbom is deprecated and only wraps actions/attest,
      # which takes the same inputs.
      - name: Attest SBOM
        if: steps.state.outputs.mode != 'done'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*.whl"
          sbom-path: "sbom/check-opencloud-security-${{ steps.version.outputs.version }}.cdx.json"

      # The plugin's audience is monitoring hosts, where software arrives
      # through apt and dnf rather than through pip. nfpm turns the wheel that
      # was just published into a .deb and an .rpm from one recipe, without
      # needing dpkg-dev, rpmbuild or a matching distribution to build on.
      # See adr/0039. They land outside dist/ because `uv publish` below
      # uploads everything it finds there.
      #
      # nfpm is pinned by version and checked against the digest published with
      # that release, rather than taken from wherever a tag points today.
      - name: Install nfpm
        if: steps.state.outputs.mode != 'done'
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build the .deb and the .rpm
        if: steps.state.outputs.mode != 'done'
        run: python scripts/build_distro_packages.py --output-dir distro-packages

      - name: Attest the distribution packages
        if: steps.state.outputs.mode != 'done'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            distro-packages/*.deb
            distro-packages/*.rpm

      # The web application is not on PyPI: the wheel and the sdist carry the
      # plugin and the scanner only. Whoever wants to run the public scan
      # service downloads this instead - the FastAPI wrapper, the frontend and
      # the container files, in one archive with a checksum next to it.
      #
      # It is built into its own directory rather than dist/, because
      # `uv publish` uploads everything it finds there and this must never
      # reach PyPI.
      - name: Build the web application bundle
        if: steps.state.outputs.mode != 'done'
        run: python scripts/build_web_bundle.py --output-dir web-bundle

      - name: Attest the web application bundle
        if: steps.state.outputs.mode != 'done'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "web-bundle/*.tar.gz"

      # The Docker setup wizard, as the one file an operator downloads: stamped
      # with this version so `--version` names the release, with a checksum
      # beside it, and attested like every other artifact. The documented
      # download points here rather than at main.
      - name: Build the Docker setup wizard
        if: steps.state.outputs.mode != 'done'
        run: python scripts/build_wizard_release.py --output-dir wizard-release

      - name: Attest the Docker setup wizard
        if: steps.state.outputs.mode != 'done'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "wizard-release/setup-wizard.py"

      # Last of the builds, not first: PyPI never takes a version back, so
      # everything that can still fail - the .deb and the .rpm, the web
      # bundle, the attestations - has already succeeded by the time anything
      # leaves this runner. See adr/0045.
      #
      # --check-url makes a second attempt safe. When the tag step below fails
      # after this one succeeded, the next push to main finds no tag and runs
      # again; uv then skips the files PyPI already holds with the same digest
      # instead of failing on "File already exists".
      - name: Publish to PyPI
        if: steps.state.outputs.mode != 'done'
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create Git tag
        if: steps.state.outputs.mode == 'release'
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      # The release is opened as a draft and published only once every asset
      # is on it, so releases/latest never points at a release without the
      # wizard. Each upload is retried, because one HTTP 500 from GitHub's
      # upload endpoint is what left v1.25.0 tagged but unreleased. A draft
      # left behind by a failed run is picked up again by the next one.
      - name: Create GitHub release
        if: steps.state.outputs.mode != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ steps.state.outputs.draft }}
        run: |
          tag="v${VERSION}"
          if [ "$RELEASE_DRAFT" != "true" ]; then
            # --notes-file provides the body, --generate-notes appends GitHub's
            # own "What's Changed" section below it.
            gh release create "$tag" --draft --verify-tag \
              --title "$tag" \
              --notes-file RELEASE.md \
              --generate-notes
          fi

          for asset in dist/* sbom/* web-bundle/* distro-packages/* wizard-release/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not upload ${asset}; run this workflow again to finish ${tag}."
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

          gh release edit "$tag" --draft=false
