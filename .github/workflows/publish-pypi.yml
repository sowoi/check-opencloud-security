name: Publish to PyPI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  # id-token and attestations are what let a downloader verify with
  # `gh attestation verify` that an artifact really came out of this workflow.
  id-token: write
  attestations: write

jobs:
  publish:
    name: Read version and publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists. Skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # OpenCloud publishes no maintenance schedule, so the supported majors
      # are derived from the GitHub release history before the wheel is built.
      # That way the published package rates unmaintained majors as end of
      # life and knows the newest release for its offline update check.
      # An unreachable documentation site must not block a release, hence
      # --allow-failure: the previously committed file stays in place.
      # The same run rewrites the generated release table in README.md, so the
      # documentation cannot quote a version that has already been superseded.
      - name: Refresh the OpenCloud release schedule
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/update_release_schedule.py --allow-failure

      - name: Build the static frontend search index
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/build_search_index.py

      # The version in pyproject.toml changed - it is only ever bumped by hand.
      # The changes collected under '## [Unreleased]' in CHANGELOG.md become
      # the notes of that version, and the same entry is written to RELEASE.md.
      - name: Update CHANGELOG.md and RELEASE.md
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/release_notes.py --version "${{ steps.version.outputs.version }}"

      - name: Commit release notes
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md RELEASE.md README.md \
            opencloud_local_scan/data/release_schedule.json \
            frontend/static/search-index.json \
            frontend/static/search-index.de.json \
            frontend/static/search-index.es.json \
            frontend/static/search-index.fr.json
          if git diff --cached --quiet; then
            echo "Release notes are already up to date."
          else
            git commit -m "docs: release notes for v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build package
        if: steps.check_tag.outputs.exists != 'true'
        run: uv build

      # The SBOM is generated from a resolved runtime environment rather than
      # from the metadata alone, so it lists the versions that were actually
      # installed, transitive ones included. It is kept out of dist/ because
      # `uv publish` uploads everything it finds there.
      - name: Generate SBOM
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          mkdir -p sbom
          uv sync --no-dev
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --of JSON --pyproject pyproject.toml --mc-type application \
            -o "sbom/check-opencloud-security-${{ steps.version.outputs.version }}.cdx.json"

      # Provenance ties each artifact to this workflow, this commit and this
      # runner. Signed with a short-lived Sigstore certificate, so there is no
      # signing key for this project to leak.
      - name: Attest build provenance
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"

      # actions/attest-sbom is deprecated and only wraps actions/attest,
      # which takes the same inputs.
      - name: Attest SBOM
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*.whl"
          sbom-path: "sbom/check-opencloud-security-${{ steps.version.outputs.version }}.cdx.json"

      - name: Publish to PyPI
        if: steps.check_tag.outputs.exists != 'true'
        run: uv publish

      # The plugin's audience is monitoring hosts, where software arrives
      # through apt and dnf rather than through pip. nfpm turns the wheel that
      # was just published into a .deb and an .rpm from one recipe, without
      # needing dpkg-dev, rpmbuild or a matching distribution to build on.
      # See adr/0039. They land outside dist/ because `uv publish` above
      # uploads everything it finds there.
      #
      # nfpm is pinned by version and checked against the digest published with
      # that release, rather than taken from wherever a tag points today.
      - name: Install nfpm
        if: steps.check_tag.outputs.exists != 'true'
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build the .deb and the .rpm
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/build_distro_packages.py --output-dir distro-packages

      - name: Attest the distribution packages
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            distro-packages/*.deb
            distro-packages/*.rpm

      # The web application is not on PyPI: the wheel and the sdist carry the
      # plugin and the scanner only. Whoever wants to run the public scan
      # service downloads this instead - the FastAPI wrapper, the frontend and
      # the container files, in one archive with a checksum next to it.
      #
      # It is built into its own directory rather than dist/, because
      # `uv publish` uploads everything it finds there and this must never
      # reach PyPI.
      - name: Build the web application bundle
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/build_web_bundle.py --output-dir web-bundle

      - name: Attest the web application bundle
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "web-bundle/*.tar.gz"

      - name: Create Git tag and GitHub release
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

          # --notes-file provides the body, --generate-notes appends GitHub's
          # own "What's Changed" section below it.
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/* sbom/* web-bundle/* distro-packages/* \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE.md \
            --generate-notes
