name: ruff check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A linter reads the tree and reports; it has no reason to hold a token that
# can write to it.
permissions:
  contents: read

jobs:
  uv-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Run ruff check
        run: uvx ruff check
