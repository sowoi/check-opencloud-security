name: Security advisories

# Two jobs with deliberately different appetites.
#
# `check` runs on every pull request and refuses a `### Security` changelog
# entry that nobody has decided about. It reads the tree and nothing else.
#
# `draft` runs after a release has actually been published, and creates the
# GitHub draft advisories for the records that say they want one. It stops
# there: publishing raises Dependabot alerts for everyone on the affected
# range and cannot be taken back, so the last step is a person running
# `--publish <slug>`, or pressing Publish in the Security tab.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Publish to PyPI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Every Security entry is accounted for
    # A release commit is made by the publish workflow with [skip ci]; the
    # check has already run on the pull request that carried the entry.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check the advisory records against CHANGELOG.md
        run: uv run python scripts/security_advisories.py --check

  draft:
    name: Draft advisories for the release just published
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      # --sync writes the new GHSA id back into the record, and that has to
      # land on main or the next run drafts a duplicate.
      contents: write
      # Creating a repository security advisory is a write to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # A record only reaches this job by saying `state: draft`, which is a
      # maintainer's decision written down in the pull request that fixed the
      # defect. Nothing here reads the prose and guesses.
      - name: Create any missing draft advisories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/security_advisories.py --sync

      - name: Commit the advisory ids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security/advisories
          if git diff --cached --quiet; then
            echo "No new advisory ids to record."
          else
            git commit -m "chore: record drafted security advisory ids [skip ci]"
            git push origin HEAD:main
          fi

      - name: Report what is waiting to be published
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Security advisory records"
            echo
            echo '```'
            uv run python scripts/security_advisories.py --list
            echo '```'
            echo
            echo "A record shown as \`draft\` has an unpublished GitHub advisory."
            echo "Publish it with \`python scripts/security_advisories.py --publish <slug>\`,"
            echo "or from the Security tab."
          } >> "$GITHUB_STEP_SUMMARY"
