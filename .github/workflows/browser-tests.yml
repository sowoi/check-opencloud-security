name: browser tests

# The web application in real browser engines: scripts, stylesheets and the
# Content-Security-Policy that the ASGI tests in run-tests.yml never execute.
# Two engines, neither of them Google's (ADR 0061): WebKit and Firefox. The
# main test job installs `playwright` too but no browser, so these modules
# skip there; here PLAYWRIGHT_TESTS_REQUIRED turns a missing browser into a
# failure instead.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "webapp/**"
      - "frontend/**"
      - "opencloud_local_scan/**"
      - "tests/browser_support.py"
      - "tests/test_webapp_browser_*.py"
      - "tests/fake_opencloud.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/browser-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox, chromium]

    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_TESTS_REQUIRED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group test

      # Both caches below are keyed on the locked playwright version: every
      # playwright release pins its own browser builds and system packages,
      # so a new lock is a new key. The image name keeps an Ubuntu upgrade of
      # ubuntu-latest from restoring another release's packages.
      - name: Read the playwright version
        id: playwright
        run: |
          echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      # Downloading the build from Microsoft's mirror once hung until the job
      # timed out. The cache only skips that download; this workflow writes
      # nothing and publishes nothing, so a restored build reaches no release.
      - name: Restore the browser build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # The system libraries come through apt, and the runners' Ubuntu mirror
      # has served them at a few hundred kB/s - WebKit needs 114 MB, Firefox
      # 49 MB - until the install timed out. The downloaded .deb files are
      # cached like the browser build: apt checks each one against the
      # package index it just fetched and downloads only what changed.
      - name: Restore the system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # Chromium is Google's build, run behind the dead proxy like the
      # others: see ADR 0068. The limit is generous so that a slow mirror
      # can still fill the cache once; with it, the install takes seconds.
      - name: Install the system packages
        timeout-minutes: 20
        run: |
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          uv run playwright install-deps "$PLAYWRIGHT_BROWSER"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives/ {} +
          echo "$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l) packages in ~/apt-archives"

      # Saved straight after the install rather than at the end of the job,
      # so a failing browser test does not throw away a slow download.
      - name: Save the system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        timeout-minutes: 10
        run: uv run playwright install "$PLAYWRIGHT_BROWSER"

      # A failed test leaves its Playwright trace (tests/browser_support.py):
      # every request, the DOM at each step and screenshots, replayable with
      # `uv run playwright show-trace <file>`. The pages are this repository's
      # own, served from loopback to fake targets - nothing else is in them.
      - name: Run the browser tests
        env:
          PLAYWRIGHT_TRACE_DIR: ${{ runner.temp }}/playwright-traces
        run: uv run pytest tests/test_webapp_browser_*.py -q

      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: ${{ runner.temp }}/playwright-traces
          if-no-files-found: ignore
          retention-days: 7
