name: browser tests

# The web application in real browser engines: scripts, stylesheets and the
# Content-Security-Policy that the ASGI tests in run-tests.yml never execute.
# Two engines, neither of them Google's (ADR 0061): WebKit and Firefox. The
# main test job installs `playwright` too but no browser, so these modules
# skip there; here PLAYWRIGHT_TESTS_REQUIRED turns a missing browser into a
# failure instead.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "webapp/**"
      - "frontend/**"
      - "opencloud_local_scan/**"
      - "tests/browser_support.py"
      - "tests/test_webapp_browser_*.py"
      - "tests/fake_opencloud.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/browser-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox, chromium]

    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_TESTS_REQUIRED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group test

      # The browser build is keyed on the locked playwright version: every
      # playwright release pins its own builds, so a new lock is a new key.
      - name: Read the playwright version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Downloading the build from Microsoft's mirror once hung until the job
      # timed out. The cache only skips that download; this workflow writes
      # nothing and publishes nothing, so a restored build reaches no release.
      - name: Restore the browser build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # The system libraries come through apt on every run - they are not in
      # the cache. Chromium is Google's build, run behind the dead proxy like
      # the others: see ADR 0068.
      - name: Install the browser
        timeout-minutes: 10
        run: |
          uv run playwright install-deps "$PLAYWRIGHT_BROWSER"
          uv run playwright install "$PLAYWRIGHT_BROWSER"

      - name: Run the browser tests
        run: uv run pytest tests/test_webapp_browser_*.py -q
