name: ansible check

# The Ansible roles in ansible/ template the Icinga2 CheckCommand and Service
# objects, so a broken variable name there silently produces a check that
# never runs. ansible-lint catches that at the 'production' profile.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ansible-lint reads the roles and reports; it has no reason to hold a token
# that can write to them.
permissions:
  contents: read

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Run ansible-lint
        working-directory: ansible
        run: uvx --from ansible-lint ansible-lint
