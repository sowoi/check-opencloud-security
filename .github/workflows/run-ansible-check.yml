name: ansible check

# The Ansible roles in ansible/ template the Icinga2 CheckCommand and Service
# objects, so a broken variable name there silently produces a check that
# never runs. ansible-lint catches that at the 'production' profile.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ansible-lint reads the roles and reports; it has no reason to hold a token
# that can write to them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Run ansible-lint
        working-directory: ansible
        run: uvx --from ansible-lint ansible-lint
