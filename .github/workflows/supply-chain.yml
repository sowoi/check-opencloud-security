name: Supply-chain checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ADR 0060: a new dependency is justified, tested and security-reviewed,
  # and approved by a maintainer, before it is used. On a pull request the
  # grandfather list is also compared with the base, because growing it is
  # the one way around the rule that the tree alone cannot show.
  dependency-policy:
    name: Every dependency is reviewed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the dependency records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run --locked python scripts/check_dependencies.py --check --base "origin/$BASE_REF"
          else
            uv run --locked python scripts/check_dependencies.py --check
          fi

  dependencies:
    name: Audit dependencies and build an SBOM
    runs-on: ubuntu-latest
    # Only this job attests, so only this job may mint a token for it.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export the locked dependency set
        run: >
          uv export --locked --all-groups --all-extras
          --no-emit-project --no-hashes --format requirements-txt
          > requirements.txt

      - name: Audit Python dependencies
        run: uvx pip-audit -r requirements.txt

      - name: Install the locked environment
        run: uv sync --locked --all-groups --all-extras

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --of JSON --pyproject pyproject.toml --mc-type application \
            -o sbom/check-opencloud-security.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-opencloud-security-sbom
          path: sbom/check-opencloud-security.cdx.json
          if-no-files-found: error

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: sbom/check-opencloud-security.cdx.json
