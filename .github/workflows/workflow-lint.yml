name: Workflow lint

# The workflows in this directory hold `contents: write`, publish to PyPI and
# Docker Hub, and one reacts to another's completion. A mistake in one of them
# passes exactly like a correct one until it is exploited or silently skips a
# step, so two linters read them before anything else does:
#
# - actionlint: expression and schema errors, and shellcheck over every `run:`
# - zizmor: the security side - template injection, credentials left in a
#   checkout, dangerous triggers, and (online, with the token) pins whose
#   version comment lies or whose action has a known vulnerability
#
# A deliberate exception is suppressed inline with `# zizmor: ignore[...]` and
# a comment saying why. tests/test_workflow_hardening.py keeps the two
# properties these linters do not check: declared permissions and digest pins.
#
# Weekly as well, because zizmor's online audits learn about vulnerable
# actions without anything here changing.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  schedule:
    - cron: "29 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned by version and digest, like nfpm in the release. shellcheck is
      # installed first so actionlint lints every `run:` with a known version
      # rather than whatever the runner image carries this month.
      - name: Install actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color -shellcheck "$HOME/.local/bin/shellcheck"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The token only reads public tags and advisories for the online audits.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format github .github/workflows
