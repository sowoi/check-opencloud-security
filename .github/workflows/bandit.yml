# Bandit is a security linter for Python. Its findings land under the
# repository's Security tab as SARIF.
#
# This used to run a third-party marketplace action. It does the same three
# things this workflow now does inline - install bandit, produce SARIF, upload
# it - and doing them here means one less unversioned dependency in the chain
# that reports on this project's security, and no action left behind on a
# deprecated Node runtime.

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '38 17 * * 3'

# The default for anything added to this file later. The job below needs more
# than this and says so; a job-level block replaces this one outright rather
# than adding to it, so the grants there are unchanged.
permissions:
  contents: read

jobs:
  bandit:
    permissions:
      contents: read # to fetch the code
      security-events: write # to upload the SARIF results
      actions: read # required by the SARIF upload on a private repository

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      # Medium severity and medium confidence: the same thresholds the
      # marketplace action was configured with. Tests and secrets are excluded
      # because a fixture is allowed to do things production code may not.
      # --exit-zero keeps the report advisory; the Security tab is where it is
      # read, and a finding should not block an unrelated pull request.
      - name: Run Bandit
        run: >
          uvx --with bandit-sarif-formatter
          bandit --recursive .
          --severity-level medium
          --confidence-level medium
          --exclude ./tests,./secrets,./.venv
          --format sarif
          --output bandit-results.sarif
          --exit-zero

      # ref and sha are passed explicitly. Left to itself the action resolves
      # the pull request's merge commit from the checkout, and GitHub may have
      # recomputed refs/pull/N/merge between the event firing and this job
      # running - the analysis then lands on a merge commit the pull request's
      # code scanning check is not looking at, and the check reports "1
      # configuration not found" even though the upload succeeded. Naming the
      # ref and sha from the event pins the analysis to the commit the check
      # expects. On push and schedule these are refs/heads/main and its commit,
      # which is what the action would have derived anyway.
      - name: Upload the SARIF report
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: bandit-results.sarif
          category: bandit
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
