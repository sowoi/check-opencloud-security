name: unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  uv-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install the project
        run: uv sync --group test

      - name: Check generated frontend documentation
        run: uv run python scripts/build_frontend_documentation.py --check

      - name: Run tests
        run: uv run --group test pytest
