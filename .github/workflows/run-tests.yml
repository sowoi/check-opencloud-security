name: unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only, because that is all a test run needs. Without this the token
# arrives with whatever the repository default grants, which is frequently
# write across every scope - handed to a job that installs and executes the
# dependency tree.
permissions:
  contents: read

jobs:
  uv-test:
    name: python
    runs-on: ubuntu-latest

    # The suite runs against `memory://`, the in-process stand-in, because a
    # test that needs a server is a test a contributor cannot run. That left
    # the `redis.asyncio` client every deployment actually uses executing
    # nowhere: the stand-in was the implementation under test and the real
    # client was the implementation shipped, with nothing checking they agree.
    # `tests/test_redis_contract.py` asks both the same questions, and this is
    # where the second one gets answered. Without `TEST_REDIS_URL` it skips,
    # which is what happens on a machine with no Redis.
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The `signing` extra pulls in `sigstore`, which the tests in
      # test_data_signing.py that verify a real attestation bundle skip
      # themselves without - installed here so that path actually runs
      # instead of only ever running on a developer's own machine.
      - name: Install the project
        run: uv sync --locked --group test --extra signing

      - name: Check generated frontend documentation
        run: uv run python scripts/build_frontend_documentation.py --check

      # Coverage is measured here and nowhere else. `nox` runs the same suite
      # on five interpreters to prove the `requires-python` promise; measuring
      # it there as well would multiply the runtime to report the same number
      # five times.
      # The term report prints the uncovered lines into the job log, which is
      # where a reviewer is already looking; `fail_under` in pyproject.toml is
      # what actually gates the build.
      - name: Run tests
        run: uv run --group test --extra signing pytest --cov --cov-report=term
