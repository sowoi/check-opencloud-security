name: mypy check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A type check reads the tree and reports; it has no reason to hold a token
# that can write to it.
permissions:
  contents: read

jobs:
  uv-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install the project
        run: uv sync --group test

      - name: Run tests
        run: uv run --group test mypy --config-file mypy.ini
