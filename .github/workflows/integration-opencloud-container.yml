name: real OpenCloud container

on:
  workflow_dispatch:
    inputs:
      image:
        description: Reviewed immutable OpenCloud image to test
        required: false
        default: opencloudeu/opencloud-rolling@sha256:0bb9038f4c01ab187a014e97550435f5d45630731aed9341d87a0b40fe72fe3d
        type: string
      candidate_image:
        description: Candidate image to evaluate; does not change the reviewed baseline
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  scanner:
    name: scanner against OpenCloud
    runs-on: ubuntu-latest
    env:
      COS_INTEGRATION_IMAGE: ${{ inputs.candidate_image || inputs.image || 'opencloudeu/opencloud-rolling@sha256:0bb9038f4c01ab187a014e97550435f5d45630731aed9341d87a0b40fe72fe3d' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install the project
        run: uv sync --locked --group test

      - name: Run real-container integration test
        run: uv run --group test pytest -q -rs tests/integration/test_real_opencloud.py
