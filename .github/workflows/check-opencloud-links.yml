name: OpenCloud documentation links

# Everything this project explains about OpenCloud is anchored in links it
# does not own: the release lifecycle page the schedule is generated from, the
# advisories, the configuration references a finding points an operator at.
# When OpenCloud reorganises its documentation those links rot without a
# single commit landing here, and a finding that explains itself with a dead
# link is a finding nobody can act on. So every merge into main re-checks
# them, and a weekly run catches the rot that happens while nothing is merged.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check documented OpenCloud links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check that every documented OpenCloud link still resolves
        # A redirect is reported but does not fail the run: opencloud.eu
        # redirects to a language version, and a job that always fails is a
        # job everybody learns to ignore.
        run: python scripts/check_documentation_links.py
