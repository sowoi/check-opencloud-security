name: nox check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only: this runs the suite on five interpreters and writes nothing back.
permissions:
  contents: read

jobs:
  uv-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install the project
        run: uv sync --group test

      - name: Run tests
        run: uv run --group test nox
