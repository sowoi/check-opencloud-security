name: nox check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only: this runs the suite on five interpreters and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uv-test:
    # One job per interpreter rather than five sessions in one job: they run in
    # parallel, and a failure names the Python it failed on. Each interpreter
    # runs the suite in three slices (tests/sharding.py), which brings a job
    # from about fifteen minutes to five. Three rather than the four the
    # coverage run uses: fifteen jobs already, and a pull request starts
    # enough others that more would only wait for a free runner.
    name: python ${{ matrix.python }} (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Quoted, or YAML reads 3.10 as the number 3.1. Keep in step with
        # PYTHON_VERSIONS in noxfile.py - tests/test_workflow_hardening.py does.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          resolution-strategy: lowest
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group test

      - name: Run tests
        env:
          PYTHON: ${{ matrix.python }}
          SHARD: ${{ matrix.shard }}
        run: uv run --group test nox --session "versions_check-${PYTHON}" -- --shard "${SHARD}/3"
