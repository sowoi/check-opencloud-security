# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # pyproject.toml holds playwright below 1.64, whose WebKit reports a CSP
    # violation for every <select>; a pull request past it could only fail.
    ignore:
      - dependency-name: "playwright"
        versions: [">=1.64"]

  # Pinned actions go stale quietly, and the way that surfaces is a runner
  # deprecation warning on every job. Let Dependabot raise it instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  # The web application's images: the Python base and the uv stage of
  # docker/Dockerfile.web, and the Redis image in docker/docker-compose.yml.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
