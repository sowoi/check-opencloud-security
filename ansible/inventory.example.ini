# Example inventory for the check-opencloud-security Ansible playbooks.
#
# Copy this file, rename it (e.g. inventory.ini), and adjust hosts/variables
# for your environment. Each host is an Icinga2 server that will run the
# check-opencloud-security plugin - it does NOT need to be the OpenCloud
# server itself.
#
# opencloud_check_host is the OpenCloud instance to scan and is normally
# different from the Ansible target host.

[icinga_targets]
icinga01.example.com opencloud_check_host=opencloud1.example.com
icinga02.example.com opencloud_check_host=opencloud2.example.com opencloud_check_proxy=http://proxy.example.com:3128

[icinga_targets:vars]
ansible_user=ansible
# ansible_become_password=changeme   # or use --ask-become-pass / vault
