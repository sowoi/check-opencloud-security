---
# Source repository cloned to build the Docker image from.
opencloud_check_repo_url: "https://github.com/sowoi/check-opencloud-security.git"
opencloud_check_repo_version: "main"
opencloud_check_clone_dest: /opt/check-opencloud-security/src

# Docker image build settings.
opencloud_check_docker_image_name: check-opencloud-security
opencloud_check_docker_image_tag: latest
opencloud_check_force_rebuild: false

# User account running the Icinga2 daemon. It is added to the "docker"
# group so it can talk to the Docker socket without root privileges.
opencloud_check_icinga_user: icinga

# Icinga2 configuration.
opencloud_check_icinga_conf_dir: /etc/icinga2/conf.d
opencloud_check_command_name: check_opencloud_security
opencloud_check_service_name: "OpenCloud Security Scan"
opencloud_check_interval: 24h
# Name of the existing Icinga2 Host object the Service is attached to.
# Defaults to the Ansible inventory_hostname.
opencloud_check_icinga_host_name: "{{ inventory_hostname }}"

# Marker files used to detect (and refuse) conflicting native/Docker
# deployments on the same host - both roles must not manage the same
# CheckCommand object.
opencloud_check_native_marker: /etc/icinga2/conf.d/.check_opencloud_security_native
opencloud_check_docker_marker: /etc/icinga2/conf.d/.check_opencloud_security_docker

# Plugin options - map 1:1 to the COS_* environment variables / CLI flags
# documented in the project README.
opencloud_check_host: "{{ inventory_hostname }}"
opencloud_check_proxy: ""
# Port the instance listens on. OpenCloud's own proxy uses 9200; leave empty
# to take the port from the host (or 443).
opencloud_check_port: ""
# OpenCloud terminates TLS itself and 'opencloud init' self-signs. Set true
# for such an instance: the untrusted chain is still reported, it just stops
# counting against the rating.
opencloud_check_insecure: false
# The service debug ports (9205, 9141, 9124, 9134, 9239) are probed by
# default. Each probe is a TCP connect, so a firewalled host costs time.
opencloud_check_no_debug_ports: false
# Where the newest release is looked up: auto, feed, pinned, bundled, off.
opencloud_check_update_source: auto
# Raise an otherwise OK result to WARNING when an update is available.
opencloud_check_update_warning: false
opencloud_check_debug: false
opencloud_check_retries: 2
opencloud_check_backoff_factor: 0.5
opencloud_check_timeout: 10
# Rating thresholds (0-5, where 5 == A+ and 0 == F). A rating at or below
# the value reports the corresponding state.
opencloud_check_warning: 3
opencloud_check_critical: 1
# Also report missing hardening measures and security headers.
opencloud_check_check_hardening: false
# Optional webhook notification. Leave the URL empty to disable the feature.
opencloud_check_webhook_url: ""
opencloud_check_webhook_on: critical
opencloud_check_webhook_timeout: 10

# Set to false to skip `icinga2 daemon -C` validation (not recommended).
opencloud_check_validate_config: true

# Set to false to skip restarting/reloading icinga2 (e.g. when applying this
# role in a larger batch and reloading separately afterwards).
opencloud_check_manage_icinga_service: true

# Path to the Docker CLI/socket used by the CheckCommand.
opencloud_check_docker_binary: /usr/bin/docker
